name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rest:
    name: REST check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install
        working-directory: restful-api
        run: bun install --frozen-lockfile
      - name: Check (format + lint + typecheck + unit/system tests)
        working-directory: restful-api
        run: bun run check

  mcp:
    name: MCP check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install
        working-directory: mcp-server-v2
        run: bun install --frozen-lockfile
      - name: Check (format + lint + typecheck + tests)
        working-directory: mcp-server-v2
        run: bun run check

  rest-integration:
    name: REST integration vs broker main
    runs-on: ubuntu-latest
    steps:
      # Cross-repo compatibility gate: this repository is checked out as
      # `meshat-api` next to the canonical broker repository, mirroring the
      # documented sibling workspace layout. Read-only checkout only.
      - name: Checkout meshat-api (this repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: meshat-api
      - name: Checkout meshcore-mqtt-broker (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Bjorkan/meshcore-mqtt-broker
          ref: main
          path: meshcore-mqtt-broker
      - name: Report broker compatibility target
        run: |
          echo "broker main SHA: $(git -C meshcore-mqtt-broker rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git -C meshcore-mqtt-broker log -1 --oneline
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install broker dependencies (integration harness tooling)
        working-directory: meshcore-mqtt-broker
        run: bun install --frozen-lockfile
      - name: Install REST dependencies
        working-directory: meshat-api/restful-api
        run: bun install --frozen-lockfile
      - name: Run real PostgreSQL integration against broker main
        working-directory: meshat-api/restful-api
        env:
          MESHCORE_BROKER_REPO: ${{ github.workspace }}/meshcore-mqtt-broker
        run: bun run test:integration

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build REST image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: restful-api
          push: false
          tags: meshat-rest-api:ci
      - name: Build MCP image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: mcp-server-v2
          push: false
          tags: meshat-mcp-v2:ci

  publish:
    name: Publish images to GHCR (:latest)
    runs-on: ubuntu-latest
    # Gate: BOTH suites must be green. If e.g. only rest passes and mcp
    # fails, this job is skipped and no packages are published.
    needs: [rest, mcp, rest-integration, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Bjorkan/meshat-api'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish REST image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: restful-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bjorkan/meshat-rest-api:latest
            ghcr.io/bjorkan/meshat-rest-api:sha-${{ steps.tags.outputs.short_sha }}
      - name: Publish MCP image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: mcp-server-v2
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bjorkan/meshat-mcp-v2:latest
            ghcr.io/bjorkan/meshat-mcp-v2:sha-${{ steps.tags.outputs.short_sha }}
